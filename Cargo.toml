[package]
name = "harness"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
flate2 = "1"
futures = "0.3.34"
libc = "0.2"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "system-proxy", "stream"] }
rmcp = { version = "3.4.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
rustyline = { version = "18.0.1", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
similar = { version = "3.2.0", default-features = false, features = ["std", "text"] }
tokio = { version = "1.53.1", features = ["full"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
