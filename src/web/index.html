<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harness</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --panel2: #fafbfc; --line: #e5e8ee; --line-strong: #d3d8e2;
  --text: #191d27; --muted: #737b8c;
  --accent: #4f68f0; --accent-hover: #3d57e6; --accent-soft: #edf1fe; --accent-ring: rgba(79, 104, 240, .18);
  --ok: #14935a; --ok-soft: #e3f5ec; --warn: #a16207; --warn-soft: #fdf2dd;
  --err: #d13c3c; --err-soft: #fdecec;
  --code: #f2f4f8; --user: #edf1fe;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-lg: 0 10px 30px rgba(16, 24, 40, .14);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1014; --panel: #16181e; --panel2: #1a1d24; --line: #262a33; --line-strong: #363c49;
    --text: #e5e8ef; --muted: #9098a8;
    --accent: #7d94ff; --accent-hover: #94a8ff; --accent-soft: #222c4e; --accent-ring: rgba(125, 148, 255, .22);
    --ok: #45d483; --ok-soft: #12291d; --warn: #eab308; --warn-soft: #2c230e;
    --err: #f47171; --err-soft: #331a1c;
    --code: #1c1f27; --user: #1f2842;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    --shadow-lg: 0 10px 30px rgba(0, 0, 0, .5);
  }
}
* { box-sizing: border-box; }
html { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { border-width: 2px; }
::selection { background: var(--accent-ring); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---------- header ---------- */
header {
  display: flex; align-items: center; gap: 24px; padding: 0 20px; height: 56px;
  background: color-mix(in srgb, var(--panel) 85%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
header h1 { font-size: 16px; margin: 0; letter-spacing: .2px; display: flex; align-items: center; gap: 9px; font-weight: 700; }
header .logo {
  width: 22px; height: 22px; border-radius: 7px; flex: none;
  background: linear-gradient(135deg, var(--accent), #a855f7);
  box-shadow: 0 2px 6px var(--accent-ring), inset 0 1px 0 rgba(255, 255, 255, .35);
}
header .cwd { margin-left: auto; color: var(--muted); font: 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
nav { display: flex; gap: 2px; }
nav button {
  background: none; border: 0; color: var(--muted); padding: 7px 13px; border-radius: 8px;
  cursor: pointer; font: inherit; font-size: 13.5px; transition: background .15s, color .15s;
}
nav button:hover { color: var(--text); background: var(--code); }
nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
main { height: calc(100vh - 56px); }

/* ---------- layout ---------- */
.page { display: none; height: 100%; }
.page.active { display: flex; }
.side { width: 300px; flex: none; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.side .top { padding: 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
.list { overflow: auto; flex: 1; padding: 8px; }
.item { padding: 9px 12px; border-radius: 9px; cursor: pointer; transition: background .12s; position: relative; }
.item:hover { background: var(--panel2); }
.item.active { background: var(--accent-soft); }
.item .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { color: var(--muted); font-size: 12px; display: flex; gap: 7px; align-items: center; margin-top: 3px; }
.content { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
.scroll { flex: 1; overflow: auto; padding: 24px 28px; }

/* ---------- cards / forms ---------- */
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 18px 20px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.card h2 { font-size: 15px; margin: 0 0 12px; }
.card h3 { font-size: 14px; margin: 0; }
label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin: 12px 0 5px; }
input, select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--panel); color: var(--text); font: inherit; transition: border-color .15s, box-shadow .15s;
}
textarea { font-family: var(--mono); font-size: 13px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }

button.btn {
  padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line-strong);
  background: var(--panel); color: var(--text); cursor: pointer; font: inherit; white-space: nowrap;
  transition: background .15s, border-color .15s, box-shadow .15s, transform .05s;
}
button.btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
button.btn:active { transform: translateY(1px); }
button.primary {
  background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600;
  box-shadow: 0 1px 3px var(--accent-ring);
}
button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
button.danger { color: var(--err); }
button.danger:hover { border-color: var(--err); background: var(--err-soft); color: var(--err); }
button:disabled { opacity: .5; cursor: default; }
button.btn.small { padding: 1px 9px; font-size: 11.5px; border-radius: 6px; }
.row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 160px; }
.row > .btn, .row > .fixed { flex: none; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }

/* ---------- badges / dots ---------- */
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.badge {
  display: inline-block; white-space: nowrap; flex: none; padding: 1px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 500; border: 1px solid transparent;
  background: var(--code); color: var(--muted);
}
.badge.running { color: var(--accent); background: var(--accent-soft); }
.badge.idle { color: var(--ok); background: var(--ok-soft); }
.badge.error { color: var(--err); background: var(--err-soft); }
.badge.cancelled { color: var(--warn); background: var(--warn-soft); }
.badge.ro { color: var(--ok); background: var(--ok-soft); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--muted); flex: none; }
.dot.running { background: var(--accent); animation: pulse 1s infinite alternate; }
.dot.idle { background: var(--ok); } .dot.error { background: var(--err); } .dot.cancelled { background: var(--warn); }
@keyframes pulse { to { opacity: .3; } }

/* ---------- transcript ---------- */
pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12.5px/1.55 var(--mono); }
.msg { margin: 0 0 16px; animation: fadeUp .18s ease; }
.msg.user {
  background: var(--user); border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
  border-radius: 12px; padding: 10px 14px; white-space: pre-wrap;
}
.msg.assistant { white-space: pre-wrap; padding: 2px 4px; }
.msg .att { color: var(--muted); font-size: 12px; margin-top: 5px; }
details.tool {
  border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  margin: 0 0 10px; box-shadow: var(--shadow); overflow: hidden; animation: fadeUp .18s ease;
}
details.tool > summary {
  cursor: pointer; padding: 7px 12px; list-style: none; display: flex; gap: 8px; align-items: baseline;
  transition: background .12s;
}
details.tool > summary:hover { background: var(--panel2); }
details.tool > summary::-webkit-details-marker { display: none; }
details.tool .name { font: 600 12.5px var(--mono); color: var(--accent); }
details.tool .args { color: var(--muted); font: 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
details.tool .body { padding: 10px 12px; border-top: 1px solid var(--line); display: grid; gap: 8px; background: var(--panel2); }
details.tool .body pre { background: var(--code); padding: 9px 11px; border-radius: 8px; max-height: 360px; overflow: auto; }
details.tool.err .name { color: var(--err); }
details.tool.err { border-color: color-mix(in srgb, var(--err) 35%, var(--line)); }
details.tool.subagent { border-left: 3px solid var(--accent); }
.sub { color: var(--muted); font: 12px var(--mono); padding-left: 12px; border-left: 2px solid var(--line); }
.note { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
.note.err { color: var(--err); white-space: pre-wrap; }

/* ---------- composer / task head ---------- */
.composer {
  border-top: 1px solid var(--line); background: var(--panel); padding: 14px 28px;
  display: flex; gap: 10px; align-items: flex-end; box-shadow: 0 -4px 16px rgba(0, 0, 0, .04);
}
.composer textarea { font-family: inherit; font-size: 14px; min-height: 44px; max-height: 240px; border-radius: 10px; }
.taskhead { display: flex; gap: 10px; align-items: center; padding: 12px 28px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.taskhead .title { font-weight: 600; font-size: 15px; flex: 1; min-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.taskhead input { width: 220px; }
.empty { color: var(--muted); text-align: center; padding: 60px 20px; }
.result { margin-top: 14px; }
.result pre { background: var(--code); padding: 12px; border-radius: 8px; max-height: 60vh; overflow: auto; }
.result.err pre { outline: 1px solid var(--err); }
.result img { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; }

/* ---------- tables (models / env pages) ---------- */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
tbody tr:last-child td, tr:last-child th { border-bottom: 0; }
table tr:hover td { background: var(--panel2); }
.provider { border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px 16px; margin-bottom: 12px; transition: border-color .15s; }
.provider:hover { border-color: var(--line-strong); }
.provider .head { display: flex; gap: 10px; align-items: center; }
.tabs2 { display: flex; gap: 6px; margin-bottom: 12px; }
.tabs2 button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

/* ---------- toast ---------- */
#toast {
  position: fixed; right: 20px; bottom: 20px; background: var(--text); color: var(--bg);
  padding: 11px 18px; border-radius: 10px; opacity: 0; transform: translateY(8px);
  transition: opacity .2s, transform .2s; pointer-events: none; max-width: 480px;
  white-space: pre-wrap; z-index: 10; box-shadow: var(--shadow-lg); font-size: 13px;
}
#toast.show { opacity: .97; transform: none; }
#toast.err { background: var(--err); color: #fff; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---------- new-task (conversation style) ---------- */
.hero { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 24px 28px; }
.hero-inner { width: 100%; max-width: 780px; }
.hero-mark {
  width: 44px; height: 44px; border-radius: 12px; margin-bottom: 16px;
  background: linear-gradient(135deg, var(--accent), #a855f7);
  box-shadow: 0 4px 14px var(--accent-ring), inset 0 1px 0 rgba(255, 255, 255, .35);
}
.hero h2 { font-size: 24px; margin: 0 0 6px; letter-spacing: -.02em; }
.hero p { color: var(--muted); margin: 0 0 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 2px; }
.chip {
  padding: 4px 13px; border-radius: 999px; border: 1px solid var(--line-strong);
  background: var(--panel); color: var(--muted); cursor: pointer; font: inherit; font-size: 12.5px;
  transition: border-color .15s, color .15s, background .15s;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.newtask-composer { border-top: 1px solid var(--line); background: var(--panel); padding: 14px 28px 18px; }
.composer-card {
  max-width: 780px; margin: 0 auto; border: 1px solid var(--line-strong); border-radius: 14px;
  background: var(--panel); box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s;
}
.composer-card:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.composer-card textarea {
  display: block; border: 0; background: transparent; box-shadow: none; resize: none;
  border-radius: 14px 14px 0 0; padding: 12px 14px 4px; min-height: 48px; max-height: 240px;
  font-family: inherit; font-size: 14px;
}
.composer-card textarea:focus { border: 0; box-shadow: none; }
.composer-foot { display: flex; gap: 8px; align-items: center; padding: 4px 8px 8px 10px; }
.composer-foot input { width: 210px; flex: none; padding: 5px 9px; font-size: 12.5px; border-radius: 8px; }
.hint-enter { margin-left: auto; color: var(--muted); font-size: 11.5px; white-space: nowrap; }

@media (max-width: 760px) {
  .page.active { flex-direction: column; }
  .side { width: 100%; max-height: 35vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .grid2 { grid-template-columns: 1fr; }
  header .cwd { display: none; }
  header { gap: 10px; padding: 0 12px; overflow-x: auto; }
  nav button { white-space: nowrap; padding: 6px 8px; }
  .scroll, .composer, .taskhead { padding-left: 16px; padding-right: 16px; }
  .newtask-composer { padding: 10px 12px 14px; }
  .hero { padding: 16px; align-items: flex-start; }
}
</style>
</head>
<body>
<header>
  <h1><span class="logo" aria-hidden="true"></span>harness</h1>
  <nav>
    <button data-page="tasks" class="active">任务</button>
    <button data-page="tools">工具</button>
    <button data-page="models">模型配置</button>
    <button data-page="env">Agents / Skills / MCP</button>
  </nav>
  <span class="cwd" id="cwd"></span>
</header>
<main>
  <!-- Tasks -->
  <section class="page active" id="page-tasks">
    <div class="side">
      <div class="top"><button class="btn primary" style="flex:1" id="new-task-btn">＋ 新建任务</button></div>
      <div class="list" id="task-list"></div>
    </div>
    <div class="content" id="task-view"></div>
  </section>

  <!-- Tools -->
  <section class="page" id="page-tools">
    <div class="side">
      <div class="top"><input id="tool-filter" placeholder="筛选工具…"></div>
      <div class="list" id="tool-list"></div>
    </div>
    <div class="content"><div class="scroll" id="tool-view"><div class="empty">选择左侧的工具，填写 JSON 参数后直接调用</div></div></div>
  </section>

  <!-- Models -->
  <section class="page" id="page-models">
    <div class="content"><div class="scroll" id="models-view"></div></div>
  </section>

  <!-- Environment -->
  <section class="page" id="page-env">
    <div class="content"><div class="scroll" id="env-view"></div></div>
  </section>
</main>
<div id="toast"></div>

<script>
"use strict";
// ---------------------------------------------------------------- helpers
let token = "";
try {
  const m = location.hash.match(/token=([^&]+)/);
  if (m) { token = m[1]; localStorage.setItem("harness-token", token); history.replaceState(null, "", location.pathname); }
  else token = localStorage.getItem("harness-token") || "";
} catch (e) {}

async function api(method, path, body) {
  const headers = { "X-Harness": "1" };
  if (token) headers.Authorization = "Bearer " + token;
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const r = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.status + " " + r.statusText);
  return data;
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}

let toastTimer;
function toast(msg, isErr) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "show" + (isErr ? " err" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = "", isErr ? 6000 : 2500);
}

const STATUS = { running: "运行中", idle: "完成", error: "出错", cancelled: "已取消" };
const oneLine = (v, n = 160) => { const s = typeof v === "string" ? v : JSON.stringify(v); return s.length > n ? s.slice(0, n) + "…" : s; };
const pretty = v => typeof v === "string" ? v : JSON.stringify(v, null, 2);

let info = null;
async function loadInfo() {
  info = await api("GET", "/api/info");
  document.getElementById("cwd").textContent = info.cwd;
  return info;
}
function modelOptions() {
  const a = info && info.config.active;
  if (!a) return [];
  const set = new Set([a.default_model, a.subagent_model, ...a.models].filter(Boolean));
  return [...set];
}
function modelDatalist(id) {
  return h("datalist", { id }, modelOptions().map(m => h("option", { value: m })));
}

// ---------------------------------------------------------------- navigation
const pages = { tasks: showTasksPage, tools: showToolsPage, models: showModelsPage, env: showEnvPage };
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x === b));
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === "page-" + b.dataset.page));
  pages[b.dataset.page]();
}));

// ---------------------------------------------------------------- tasks
let tasks = [];
let currentTask = null; // id, or null for the new-task form
let source = null;

async function refreshTasks() {
  try { tasks = await api("GET", "/api/tasks"); } catch (e) { return; }
  const list = document.getElementById("task-list");
  list.replaceChildren(...(tasks.length ? tasks.map(t => h("div", {
      class: "item" + (t.id === currentTask ? " active" : ""), onclick: () => openTask(t.id) },
    h("div", { class: "t" }, t.title),
    h("div", { class: "s" }, h("span", { class: "dot " + t.status }), STATUS[t.status] || t.status,
      h("span", {}, "·"), t.agent, h("span", { class: "mono", style: "overflow:hidden;text-overflow:ellipsis;white-space:nowrap" }, t.model))
  )) : [h("div", { class: "empty" }, "还没有任务")]));
  const cur = tasks.find(t => t.id === currentTask);
  if (cur) updateTaskHead(cur);
}

function showTasksPage() {
  if (currentTask === null) showNewTask(); // refreshes the list itself
  else refreshTasks();
}

function showNewTask() {
  if (source) { source.close(); source = null; }
  currentTask = null;
  refreshTasks();
  const agents = (info ? info.agents : []);
  let agentName = "main";
  const chips = h("div", { class: "chips" });
  const agentHint = h("div", { class: "note", style: "margin:8px 0 0" });
  const model = h("input", { list: "dl-new-model", placeholder: "默认模型" });
  const syncHint = () => {
    chips.replaceChildren(h("button", { class: "chip" + (agentName === "main" ? " active" : ""), onclick: () => { agentName = "main"; syncHint(); prompt.focus(); } }, "main"),
      agents.map(a => h("button", { class: "chip" + (agentName === a.name ? " active" : ""), title: a.description, onclick: () => { agentName = a.name; syncHint(); prompt.focus(); } }, a.name)));
    const a = agents.find(x => x.name === agentName);
    agentHint.textContent = a ? a.description + (a.tools ? `  [工具: ${a.tools.join(", ")}]` : "") : "主 agent：可使用 bash / read / write / grep / skill / MCP 工具，并可再派发子 agent。";
    const act = info && info.config.active;
    model.placeholder = (a ? (a.model || (act && act.subagent_model) || (act && act.default_model)) : (act ? act.default_model : "未配置"));
  };
  syncHint();

  const prompt = h("textarea", { rows: 1, placeholder: "描述要完成的任务…" });
  const send = h("button", { class: "btn primary" }, "发送 ↑");
  const go = async () => {
    if (!prompt.value.trim()) return;
    send.disabled = true;
    try {
      const t = await api("POST", "/api/tasks", { prompt: prompt.value, agent: agentName, model: model.value });
      openTask(t.id);
    } catch (e) { toast(e.message, true); }
    send.disabled = false;
  };
  send.addEventListener("click", go);
  prompt.addEventListener("input", () => { prompt.style.height = "auto"; prompt.style.height = Math.min(prompt.scrollHeight, 240) + "px"; });
  prompt.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    if (!e.shiftKey || e.ctrlKey || e.metaKey) { e.preventDefault(); go(); }
  });
  const noModel = info && !info.config.active;
  document.getElementById("task-view").replaceChildren(
    h("div", { class: "hero" },
      h("div", { class: "hero-inner" },

let transcript, pending, assistantEl, subagents;
function openTask(id) {
  if (source) { source.close(); source = null; }

  const t = tasks.find(x => x.id === id) || { id, title: "任务 #" + id, status: "", model: "", agent: "" };

    send.disabled = true;
    try { await api("POST", `/api/tasks/${id}/messages`, { prompt: input.value }); input.value = ""; refreshTasks(); }
    catch (e) { toast(e.message, true); }
    send.disabled = false;
  };

    h("span", { class: "muted", id: "task-agent" }, t.agent),

      try { await api("POST", `/api/tasks/${id}/model`, { model: model.value }); toast("已切换模型"); refreshTasks(); }

    h("button", { class: "btn danger", onclick: async () => {

function updateTaskHead(t) {
  const st = document.getElementById("task-status");
  if (!st) return;
  st.className = "badge " + t.status; st.textContent = STATUS[t.status] || t.status;
  document.getElementById("task-title").textContent = t.title;

  document.getElementById("task-cancel").disabled = t.status !== "running";
  const m = document.getElementById("task-model");
  if (m && document.activeElement !== m) m.value = t.model;

function stickToBottom(fn) {
  const atBottom = transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 60;
  fn();
  if (atBottom) transcript.scrollTop = transcript.scrollHeight;
}

// Tool calls that will never get a result (the turn failed or was cancelled).
function abandonPending(label) {
  for (const p of pending) { const b = p.el.querySelector(".badge"); b.textContent = label; b.className = "badge cancelled"; }
  pending = [];
}

const SUB_STATUS = { running: ["运行中", "running"], completed: ["完成", "idle"], failed: ["失败", "error"], stopped: ["已停止", "cancelled"] };

// One card per subagent, where it first appears; follow-ups add to it.
function subagentCard(ev) {
  let card = subagents.get(ev.id);
  if (card) return card;
  const badge = h("span", { class: "badge running" }, "运行中");
  const body = h("div", { class: "body" });
  const owner = currentTask;
  const stop = h("button", { class: "btn small", onclick: async e => {
    e.preventDefault(); e.stopPropagation();
    try { await api("POST", `/api/tasks/${owner}/subagents/${encodeURIComponent(ev.id)}/stop`); }
    catch (err) { toast(err.message, true); }
  } }, "停止");
  const el = h("details", { class: "tool subagent" },
    h("summary", {}, h("span", { class: "name" }, "◦ " + ev.label),
      h("span", { class: "args" }, ev.id + (ev.background ? " · 后台" : "")), badge, stop), body);
  card = { el, body, badge, stop, runs: 0 };
  subagents.set(ev.id, card);
  transcript.append(el);
  return card;
}

function renderEvent(ev) {
  stickToBottom(() => {
    switch (ev.type) {
      case "user":
        assistantEl = null;
        transcript.append(h("div", { class: "msg user" }, ev.text,
          (ev.attachments || []).length ? h("div", { class: "att" }, "附件: " + ev.attachments.join(", ")) : null,
          (ev.warnings || []).length ? h("div", { class: "att" }, "⚠ " + ev.warnings.join("; ")) : null));
        break;
      case "text":
        if (!assistantEl) { assistantEl = h("div", { class: "msg assistant" }); transcript.append(assistantEl); }
        assistantEl.append(ev.text);
        break;
      case "text_end": assistantEl = null; break;
      case "tool_call": {
        assistantEl = null;
        const body = h("div", { class: "body" }, h("pre", {}, pretty(ev.input)));
        const d = h("details", { class: "tool" },
          h("summary", {}, h("span", { class: "name" }, "● " + ev.name), h("span", { class: "args" }, oneLine(ev.input)), h("span", { class: "badge" }, "…")),
          body);
        transcript.append(d);
        pending.push({ name: ev.name, el: d, body });
        break;
      }
      case "subagent": subagentCard(ev).body.append(h("div", { class: "sub" }, `${ev.tool} ${oneLine(ev.input, 120)}`)); break;
      case "subagent_status": {
        const card = subagentCard(ev);
        const [label, cls] = SUB_STATUS[ev.status] || [ev.status, ""];
        card.badge.textContent = label; card.badge.className = "badge " + cls;
        card.stop.disabled = ev.status !== "running";
        if (ev.status === "running") {
          if (card.runs++ > 0) card.body.append(h("div", { class: "sub" }, "— 继续 —"));
        } else {
          card.body.append(h("div", { class: "sub" }, `${label} · ${ev.model} · ${ev.tool_calls} 次工具调用 · ${ev.seconds}s`));
          if (ev.report) card.body.append(h("pre", {}, ev.report));
        }
        break;
      }
      case "wake": assistantEl = null; transcript.append(h("div", { class: "note" }, "↻ 后台子 agent 有了结果，继续")); break;
      case "tool_result": {
        const i = pending.findIndex(x => x.name === ev.name);
        const p = i >= 0 ? pending.splice(i, 1)[0] : null;
        const out = h("pre", {}, ev.content || "(空)");
        if (p) {
          p.body.append(out);
          const b = p.el.querySelector(".badge");
          b.textContent = ev.is_error ? "错误" : "完成"; b.className = "badge " + (ev.is_error ? "error" : "idle");
          if (ev.is_error) p.el.classList.add("err");
        } else transcript.append(out);
        break;
      }
      case "error": transcript.append(h("div", { class: "note err" }, "✖ " + ev.message)); abandonPending("未完成"); break;
      case "cancelled": transcript.append(h("div", { class: "note" }, "— 已取消 —")); abandonPending("已取消"); break;
      case "model": transcript.append(h("div", { class: "note" }, "模型切换为 " + ev.model)); break;
      case "status": {
        const t = tasks.find(x => x.id === currentTask);
        if (t) { t.status = ev.status; t.model = ev.model; updateTaskHead(t); }
        if (ev.status !== "running") refreshTasks();
        break;
      }
    }
  });
}

function skeleton(schema) {
  const out = {};
  const props = (schema && schema.properties) || {};
  for (const name of (schema && schema.required) || Object.keys(props).slice(0, 1)) {
    const p = props[name] || {};
    const type = Array.isArray(p.type) ? p.type[0] : p.type;
    out[name] = p.enum ? p.enum[0] : p.default !== undefined ? p.default :
      ({ string: "", integer: 0, number: 0, boolean: false, array: [], object: {} })[type] ?? null;
  }
  return out;
}

function showTool(t) {
  const input = h("textarea", { rows: 10 }, JSON.stringify(skeleton(t.schema), null, 2));
  const result = h("div", {});
  const run = h("button", { class: "btn primary" }, "调用");

    } catch (e) { toast(e.message, true); }
    run.disabled = false; run.textContent = "调用";
  });
  input.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) run.click(); });
  document.getElementById("tool-view").replaceChildren(h("div", { class: "card" },
    h("div", { style: "display:flex;gap:10px;align-items:center" }, h("h2", { class: "mono", style: "margin:0" }, t.name),

      info.skills.length ? h("table", {}, h("tr", {}, h("th", {}, "名称"), h("th", {}, "说明")),
        info.skills.map(s => h("tr", {}, h("td", { class: "mono" }, "/" + s.name), h("td", {}, s.description, h("div", { class: "muted mono" }, s.dir)))))
        : h("p", { class: "note" }, "未发现 skill（.harness/skills、.claude/skills 及 ~ 下同名目录）")),
    h("div", { class: "card" }, h("h2", {}, "MCP 服务器"),
      info.mcp.length ? h("table", {}, h("tr", {}, h("th", {}, "服务器"), h("th", {}, "状态 / 工具")),
        info.mcp.map(m => h("tr", {}, h("td", { class: "mono" }, m.name),
          h("td", {}, m.error ? h("span", { style: "color:var(--err)" }, m.error) : h("span", { class: "mono" }, m.tools.join(", ") || "(无工具)")))))
        : h("p", { class: "note" }, "未配置 MCP 服务器（.mcp.json 或 ~/.harness/mcp.json）")));
}

// ---------------------------------------------------------------- start
loadInfo().then(showTasksPage).catch(e => toast("无法连接 harness：" + e.message, true));
</script>
</body>
</html>
